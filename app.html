<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" id="metaThemeColor" content="#f3f4f6" />
  <link rel="manifest" href="manifest.json">
  <title>CASHBANK</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --info: #0284c7;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    *{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color: transparent;}
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: background-color 0.3s, color 0.3s;
    }
    
    .app{
      width: 100%;
      max-width: 720px;
      height: 100%;
      overflow-y: auto;
      padding: 12px;
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
    }
    
    .card{
      background:var(--card); border-radius:var(--radius);
      padding:14px; box-shadow:var(--shadow); margin-bottom:12px;
      border: 1px solid var(--border);
    }
    
    .header-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    header h1{font-size:20px; font-weight:700;}
    
    .theme-toggle {
      background: transparent; border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--text); font-size: 13px;
      min-height: 38px;
    }

    .balance-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;
    }
    @media (max-width: 420px) {
      .balance-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .balance-card {
      padding: 10px 6px; border-radius: 10px; text-align: center; border: 1px solid var(--border);
      background: var(--card);
    }
    .balance-card.bank { border-top: 4px solid var(--primary); }
    .balance-card.cash { border-top: 4px solid var(--success); }
    .balance-card.total { border-top: 4px solid #8b5cf6; }
    .balance-card .title { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .balance-card .val { font-size: 14px; font-weight: 700; margin-top: 4px; word-break: break-all; }

    .form-grid{display:grid; grid-template-columns:1fr; gap:8px}
    @media(min-width:768px){.form-grid{grid-template-columns:140px 1fr 70px}}
    
    select, input, button{
      font-size:16px;
      padding:10px; border:1px solid var(--border);
      border-radius:10px; background:var(--card); color:var(--text);
    }
    
    .btn{cursor:pointer; border:none; font-weight:600; min-height: 42px;}
    .btn-primary{background:var(--success); color:white}
    .btn-refund{background:var(--info); color:white}
    .btn-danger{background:var(--danger); color:white}
    .btn-ghost{background:var(--bg); color:var(--text)}
    
    .quick-chips { 
      display: flex; 
      gap: 6px; 
      overflow-x: auto; 
      white-space: nowrap;
      padding: 4px 0; 
      margin-top: 6px; 
      -webkit-overflow-scrolling: touch; 
      scrollbar-width: none;
    }
    .quick-chips::-webkit-scrollbar { display: none; }
    
    .quick-chips button { 
      padding: 6px 14px; 
      font-size: 13px; 
      border-radius: 8px; 
      flex-shrink: 0; 
      min-height: 38px; 
      border: 1px solid var(--border);
    }

    .controls{display:flex; gap:8px; margin-top: 8px;}
    .controls .btn{flex:1; padding: 12px 0;}

    .history-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px}
    
    .history-table{
      width:100%; border-collapse:collapse; font-size:13px; line-height:1.4; table-layout: fixed;
    }
    .history-table th, .history-table td{
      padding:10px 6px; border-bottom:1px solid var(--border); vertical-align:middle;
    }
    .history-table th:nth-child(1), .history-table td:nth-child(1) { width: 45%; text-align: left; }
    .history-table th:nth-child(2), .history-table td:nth-child(2) { width: 25%; text-align: center; }
    .history-table th:nth-child(3), .history-table td:nth-child(3) { width: 30%; text-align: right; }

    .val-plus { color: var(--success); font-weight: 600; }
    .val-minus { color: var(--danger); font-weight: 600; }
    .val-info { color: var(--info); font-weight: 600; }

    .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    .stat{padding:10px; border-radius:10px; text-align:center}
    .stat .label{color:var(--muted); font-size:13px}
    .stat .value{font-size:16px; font-weight:700; margin-top:4px}
    
    #historyWrapper { width: 100%; }
    .hidden{display:none}

    .history-toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    
    .load-more-btn {
      width: 100%; padding: 10px; text-align: center; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; cursor: pointer; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="header-bar">
        <header><h1>CASHBANK</h1></header>
        <button id="themeToggle" class="theme-toggle" type="button">🌙 Dark Mode</button>
      </div>

      <div class="balance-grid">
        <div class="balance-card bank">
          <div class="title">Bank</div>
          <div id="bankBalance" class="val">0 VND</div>
        </div>
        <div class="balance-card cash">
          <div class="title">Cash</div>
          <div id="cashBalance" class="val">0 VND</div>
        </div>
        <div class="balance-card total">
          <div class="title">Total</div>
          <div id="totalBalance" class="val">0 VND</div>
        </div>
      </div>

      <form id="mainForm" autocomplete="off">
        <div class="form-grid">
          <select id="source"><option value="cash">Cash</option><option value="bank">Bank</option></select>
          <input id="amount" placeholder="Enter amount..." inputmode="numeric" />
          <button id="btn000" class="btn btn-ghost" type="button">000</button>
        </div>

        <div class="quick-chips">
          <button type="button" class="btn btn-ghost" onclick="addQuick(1000)">+1k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(2000)">+2k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(5000)">+5k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(10000)">+10k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(20000)">+20k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(50000)">+50k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(100000)">+100k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(500000)">+500k</button>
        </div>

        <div class="controls">
          <button id="btnAdd" class="btn btn-primary" type="button">Income (+)</button>
          <button id="btnRefund" class="btn btn-refund" type="button">Refund (↻)</button>
          <button id="btnSubtract" class="btn btn-danger" type="button">Expense (-)</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="history-head">
        <h2>Transaction History</h2>
        <button id="toggleHistory" class="btn btn-ghost" style="padding:6px 10px;font-size:13px" type="button">Show</button>
      </div>
      
      <div id="historyWrapper" class="hidden">
        <div class="history-toolbar">
          <button id="btnClearHistory" class="btn btn-danger" style="padding:6px 10px; font-size:13px; white-space:nowrap; border-radius:6px;" type="button">Clear</button>
          <button id="btnUndo" class="btn btn-ghost" style="padding:6px 10px; font-size:13px; white-space:nowrap; border-radius:6px; border:1px solid var(--border);" type="button" title="Undo">↩ Undo</button>
        </div>

        <table class="history-table">
          <thead>
            <tr><th>Time</th><th style="text-align:center;">Source</th><th style="text-align:right;">Amount</th></tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
        <button id="btnLoadMore" class="load-more-btn hidden" type="button">Load older transactions</button>
      </div>
    </div>

    <div class="card">
      <div class="history-head">
        <h2>Monthly Summary</h2>
        <button id="toggleMonthly" class="btn btn-ghost" style="padding:6px 10px;font-size:13px" type="button">Show</button>
      </div>
      <div id="monthlyWrapper" class="hidden">
        <input id="monthPicker" type="month" style="margin:8px 0;width:100%" />
        <div class="grid-2">
          <div class="stat" style="background:rgba(220,38,38,0.1); border:1px solid rgba(220,38,38,0.2)">
            <div class="label">Monthly Expenses</div>
            <div id="totalExpense" class="value" style="color:var(--danger)">0 VND</div>
          </div>
          <div class="stat" style="background:rgba(22,163,74,0.1); border:1px solid rgba(22,163,74,0.2)">
            <div class="label">Monthly Income</div>
            <div id="totalIncome" class="value" style="color:var(--success)">0 VND</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function(){
    const STORAGE_KEY="money-manager-v1";
    let state={
      balances:{bank:0,cash:0},
      history:[],
      hiddenHistory:[],
      showHistory:false,
      showMonthly:false,
      theme: localStorage.getItem("theme") || "light",
      displayLimit: 30,
      selectedMonth:(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`})()
    };
    
    const sourceEl=document.getElementById("source"), amountEl=document.getElementById("amount");
    const btn000=document.getElementById("btn000"), btnAdd=document.getElementById("btnAdd"), btnSubtract=document.getElementById("btnSubtract"), btnRefund=document.getElementById("btnRefund"), btnUndo=document.getElementById("btnUndo");
    const bankBalanceEl=document.getElementById("bankBalance"), cashBalanceEl=document.getElementById("cashBalance"), totalBalanceEl=document.getElementById("totalBalance");
    const toggleHistoryBtn=document.getElementById("toggleHistory"), historyWrapper=document.getElementById("historyWrapper"), historyBody=document.getElementById("historyBody"), btnLoadMore=document.getElementById("btnLoadMore");
    const toggleMonthlyBtn=document.getElementById("toggleMonthly"), monthlyWrapper=document.getElementById("monthlyWrapper"), monthPicker=document.getElementById("monthPicker");
    const totalExpenseEl=document.getElementById("totalExpense"), totalIncomeEl=document.getElementById("totalIncome");
    const btnClearHistory=document.getElementById("btnClearHistory"), themeToggleBtn=document.getElementById("themeToggle");
    const metaThemeColor=document.getElementById("metaThemeColor");

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", state.theme);
      themeToggleBtn.textContent = state.theme === "dark" ? "☀️ Light Mode" : "🌙 Dark Mode";
      const bgColor = state.theme === "dark" ? "#0f172a" : "#f3f4f6";
      if(metaThemeColor) metaThemeColor.setAttribute("content", bgColor);
      localStorage.setItem("theme", state.theme);
    }
    themeToggleBtn.addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
    });

    function fmt(num){ return Number(num||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g," "); }

    function formatTimeDisplay(d) {
      let hours = d.getHours();
      let minutes = String(d.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${hours}:${minutes}${ampm} ${day}/${month}/${year}`;
    }

    amountEl.addEventListener("input", (e) => {
      let raw = e.target.value.replace(/\D/g, "");
      e.target.value = raw ? fmt(raw) : "";
    });

    window.addQuick = function(num) {
      let cur = Number(amountEl.value.replace(/\s+/g, "")) || 0;
      amountEl.value = fmt(cur + num);
    };

    function load(){
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw){
        try{
          const p=JSON.parse(raw);
          state.balances=p.balances||state.balances;
          state.history=p.history||[];
          state.hiddenHistory=p.hiddenHistory||[];
        }catch(e){}
      }
      applyTheme();
    }
    
    function save(){
      localStorage.setItem(STORAGE_KEY,JSON.stringify({balances:state.balances,history:state.history,hiddenHistory:state.hiddenHistory}));
    }

    function addHistory(val,src,type){
      const d=new Date();
      state.history.unshift({
        id:Date.now(), type, src, value:val,
        formattedTime: formatTimeDisplay(d),
        yr: d.getFullYear(), mo: d.getMonth() + 1
      });
      save(); render();
    }
    
    function confirmAction(type,val,src){
      const srcText=src==="bank"?"Bank":"Cash";
      return confirm(`Confirm "${type}" ${fmt(val)} VND / ${srcText}?`);
    }
    
    function add(){const v=Number(amountEl.value.replace(/\s+/g,""));if(v>0&&confirmAction("Income",v,sourceEl.value)){state.balances[sourceEl.value]+=v;addHistory(v,sourceEl.value,"Income");amountEl.value="";}}
    function sub(){const v=Number(amountEl.value.replace(/\s+/g,""));if(v>0&&confirmAction("Expense",v,sourceEl.value)){state.balances[sourceEl.value]-=v;addHistory(v,sourceEl.value,"Expense");amountEl.value="";}}
    function ref(){const v=Number(amountEl.value.replace(/\s+/g,""));if(v>0&&confirmAction("Refund",v,sourceEl.value)){state.balances[sourceEl.value]+=v;addHistory(v,sourceEl.value,"Refund");amountEl.value="";}}
    
    function undo(){
      if(state.history.length===0){alert("No transactions to undo.");return;}
      const last=state.history.shift();
      if(!confirm(`Undo transaction "${last.type}" ${fmt(last.value)} VND / ${last.src==="bank"?"Bank":"Cash"}?`)){
          state.history.unshift(last); return;
      }
      if(last.type==="Income" || last.type==="Thu"){state.balances[last.src]-=last.value;}
      else if(last.type==="Expense" || last.type==="Chi"){state.balances[last.src]+=last.value;}
      else if(last.type==="Refund" || last.type==="Hoàn"){state.balances[last.src]-=last.value;}
      save(); render();
    }

    function add000(e){
      e.preventDefault();
      const cur=Number(amountEl.value.replace(/\s+/g,""))||0;
      amountEl.value=cur===0?"1 000":fmt(cur*1000);
    }
    
    function renderHistory(){
      historyBody.innerHTML="";
      if(state.history.length===0){
        historyBody.innerHTML="<tr><td colspan='3' style='text-align:center;color:var(--muted);padding:12px'>No data available</td></tr>";
        btnLoadMore.classList.add("hidden");
        return;
      }
      
      const visibleData = state.history.slice(0, state.displayLimit);
      visibleData.forEach(h=>{
        const tr=document.createElement("tr");
        const isPlus = h.type === "Income" || h.type === "Thu";
        const isRefund = h.type === "Refund" || h.type === "Hoàn";
        
        let valClass = "val-minus";
        let sourceClass = "val-minus";
        let sign = "-";

        if(isPlus) {
          valClass = "val-plus";
          sourceClass = "val-plus";
          sign = "+";
        } else if(isRefund) {
          valClass = "val-info";
          sourceClass = "val-info";
          sign = "+";
        }

        const timeDisplay = h.formattedTime || (h.time + " (" + h.date + ")");
        
        tr.innerHTML=`
          <td>${timeDisplay}</td>
          <td style="text-align:center;" class="${sourceClass}">${h.src==="bank"?"Bank":"Cash"}</td>
          <td class="right ${valClass}">${sign}${fmt(h.value)} VND</td>
        `;
        historyBody.appendChild(tr);
      });

      if(state.history.length > state.displayLimit) {
        btnLoadMore.classList.remove("hidden");
      } else {
        btnLoadMore.classList.add("hidden");
      }
    }

    btnLoadMore.addEventListener("click", () => {
      state.displayLimit += 30;
      renderHistory();
    });

    function renderBalances(){
      const b=state.balances.bank, c=state.balances.cash, t=b+c;
      bankBalanceEl.textContent=fmt(b)+" VND";
      cashBalanceEl.textContent=fmt(c)+" VND";
      totalBalanceEl.textContent=fmt(t)+" VND";
    }
    
    function renderMonthly(){
        if(!state.selectedMonth) return;
        const [y,m]=state.selectedMonth.split("-").map(Number);
        const allData = [...state.history, ...state.hiddenHistory];
        
        const rec=allData.filter(h=>{
          if(h.yr && h.mo) return h.yr === y && h.mo === m;
          const cleanDate = (h.date || "").replace(/[^\d/]/g, "");
          const parts=cleanDate.split("/");
          if(parts.length>=3) return Number(parts[2])===y && Number(parts[1])===m;
          return false;
        });
        
        let expense=rec.filter(h=>h.type==="Expense" || h.type==="Chi").reduce((s,h)=>s+h.value,0);
        const refund=rec.filter(h=>h.type==="Refund" || h.type==="Hoàn").reduce((s,h)=>s+h.value,0);
        const income=rec.filter(h=>h.type==="Income" || h.type==="Thu").reduce((s,h)=>s+h.value,0);
        expense=Math.max(expense-refund,0);
        totalExpenseEl.textContent=fmt(expense)+" VND"; totalIncomeEl.textContent=fmt(income)+" VND";
    }

    function render(){
        renderBalances(); renderHistory(); renderMonthly();
        monthPicker.value=state.selectedMonth;
        historyWrapper.classList.toggle("hidden",!state.showHistory);
        toggleHistoryBtn.textContent=state.showHistory?"Hide":"Show";
        monthlyWrapper.classList.toggle("hidden",!state.showMonthly);
        toggleMonthlyBtn.textContent=state.showMonthly?"Hide":"Show";
    }

    load();
    btn000.addEventListener("click",add000);
    document.getElementById("mainForm").addEventListener("submit",e=>{e.preventDefault();add();});
    btnAdd.addEventListener("click",e=>{e.preventDefault();add();});
    btnSubtract.addEventListener("click",e=>{e.preventDefault();sub();});
    btnRefund.addEventListener("click",e=>{e.preventDefault();ref();});
    btnUndo.addEventListener("click",e=>{e.preventDefault();undo();});
    
    btnClearHistory.addEventListener("click", () => {
        if(state.history.length === 0){ alert("History is empty!"); return; }
        if(confirm("Are you sure?")){
            state.hiddenHistory = [...state.hiddenHistory, ...state.history];
            state.history = []; 
            save(); render();
        }
    });

    toggleHistoryBtn.addEventListener("click",()=>{state.showHistory=!state.showHistory;render();});
    toggleMonthlyBtn.addEventListener("click",()=>{state.showMonthly=!state.showMonthly;render();});
    monthPicker.addEventListener("change",e=>{state.selectedMonth=e.target.value;renderMonthly();});
    
    render();
  })();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
