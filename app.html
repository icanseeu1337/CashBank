<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="manifest.json">
  <title>CASHBANK</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --info: #0284c7;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    *{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color: transparent;}
    
    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:var(--bg); color:var(--text);
      display:flex; justify-content:center; align-items:flex-start;
      padding:12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      transition: background 0.3s, color 0.3s;
    }
    
    .app{width:100%; max-width:720px; position:relative;}
    
    .card{
      background:var(--card); border-radius:var(--radius);
      padding:14px; box-shadow:var(--shadow); margin-bottom:12px;
      border: 1px solid var(--border);
    }
    
    .header-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    header h1{font-size:20px; font-weight:700;}
    
    .theme-toggle {
      background: transparent; border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--text); font-size: 13px;
      min-height: 38px;
    }

    /* Cards Số dư - Tránh tràn khung */
    .balance-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;
    }
    @media (max-width: 420px) {
      .balance-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .balance-card {
      padding: 10px 6px; border-radius: 10px; text-align: center; border: 1px solid var(--border);
      background: var(--card);
    }
    .balance-card.bank { border-top: 4px solid var(--primary); }
    .balance-card.cash { border-top: 4px solid var(--success); }
    .balance-card.total { border-top: 4px solid #8b5cf6; }
    .balance-card .title { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .balance-card .val { font-size: 14px; font-weight: 700; margin-top: 4px; word-break: break-all; }

    .form-grid{display:grid; grid-template-columns:1fr; gap:8px}
    @media(min-width:768px){.form-grid{grid-template-columns:140px 1fr 70px}}
    
    select, input, button{
      font-size:16px;
      padding:10px; border:1px solid var(--border);
      border-radius:10px; background:var(--card); color:var(--text);
    }
    
    .btn{cursor:pointer; border:none; font-weight:600; min-height: 42px;}
    .btn-primary{background:var(--success); color:white}
    .btn-refund{background:var(--info); color:white}
    .btn-danger{background:var(--danger); color:white}
    .btn-ghost{background:var(--bg); color:var(--text)}
    
    /* Thanh phím nhanh cuộn ngang an toàn tuyệt đối trên Mobile */
    .quick-chips { 
      display: flex; 
      gap: 6px; 
      overflow-x: auto; 
      white-space: nowrap;
      padding: 4px 0; 
      margin-top: 6px; 
      -webkit-overflow-scrolling: touch; 
      scrollbar-width: none; /* Firefox */
    }
    .quick-chips::-webkit-scrollbar { display: none; /* Chrome, Safari, Opera */ }
    
    .quick-chips button { 
      padding: 6px 14px; 
      font-size: 13px; 
      border-radius: 8px; 
      flex-shrink: 0; 
      min-height: 38px; 
      border: 1px solid var(--border);
    }

    .controls{display:flex; gap:8px; margin-top: 8px;}
    .controls .btn{flex:1; padding: 12px 0;}

    .history-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px}
    .history-table{
      width:100%; border-collapse:collapse; font-size:13px; line-height:1.4; white-space:nowrap;
    }
    .history-table th,.history-table td{
      padding:8px 6px; border-bottom:1px solid var(--border); vertical-align:middle;
    }
    .history-table td.right{text-align:right}
    
    .badge{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:6px; font-weight:700; font-size: 12px;}
    .badge.t{background:#dcfce7; color:#15803d}
    .badge.c{background:#fee2e2; color:#b91c1c}
    .badge.h{background:#e0f2fe; color:#0369a1}

    .val-plus { color: var(--success); font-weight: 600; }
    .val-minus { color: var(--danger); font-weight: 600; }

    .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    .stat{padding:10px; border-radius:10px; text-align:center}
    .stat .label{color:var(--muted); font-size:13px}
    .stat .value{font-size:16px; font-weight:700; margin-top:4px}
    
    #historyWrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .hidden{display:none}

    .history-toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    
    .load-more-btn {
      width: 100%; padding: 10px; text-align: center; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; cursor: pointer; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="header-bar">
        <header><h1>CASHBANK</h1></header>
        <button id="themeToggle" class="theme-toggle" type="button">🌙 Chế độ tối</button>
      </div>

      <!-- Thẻ Thống kê Số dư -->
      <div class="balance-grid">
        <div class="balance-card bank">
          <div class="title">Ngân hàng</div>
          <div id="bankBalance" class="val">0 đ</div>
        </div>
        <div class="balance-card cash">
          <div class="title">Tiền mặt</div>
          <div id="cashBalance" class="val">0 đ</div>
        </div>
        <div class="balance-card total">
          <div class="title">Tổng cộng</div>
          <div id="totalBalance" class="val">0 đ</div>
        </div>
      </div>

      <form id="mainForm" autocomplete="off">
        <div class="form-grid">
          <select id="source"><option value="cash">Tiền mặt</option><option value="bank">Ngân hàng</option></select>
          <input id="amount" placeholder="Nhập số tiền..." inputmode="numeric" />
          <button id="btn000" class="btn btn-ghost" type="button">000</button>
        </div>

        <!-- Phím chọn nhanh mệnh giá từ 1k đến 500k (Đã thêm 20k) -->
        <div class="quick-chips">
          <button type="button" class="btn btn-ghost" onclick="addQuick(1000)">+1k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(2000)">+2k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(5000)">+5k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(10000)">+10k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(20000)">+20k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(50000)">+50k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(100000)">+100k</button>
          <button type="button" class="btn btn-ghost" onclick="addQuick(500000)">+500k</button>
        </div>

        <div class="controls">
          <button id="btnAdd" class="btn btn-primary" type="button">Thu (+)</button>
          <button id="btnRefund" class="btn btn-refund" type="button">Hoàn (↻)</button>
          <button id="btnSubtract" class="btn btn-danger" type="button">Chi (-)</button>
        </div>
      </form>
    </div>

    <!-- Lịch sử -->
    <div class="card">
      <div class="history-head">
        <h2>Lịch sử Thu/Chi</h2>
        <button id="toggleHistory" class="btn btn-ghost" style="padding:6px 10px;font-size:13px" type="button">Hiện</button>
      </div>
      
      <div id="historyWrapper" class="hidden">
        <div class="history-toolbar">
          <button id="btnClearHistory" class="btn btn-danger" style="padding:6px 10px; font-size:13px; white-space:nowrap; border-radius:6px;" type="button">🗑️ Xóa</button>
          <button id="btnUndo" class="btn btn-ghost" style="padding:6px 10px; font-size:13px; white-space:nowrap; border-radius:6px; border:1px solid var(--border);" type="button" title="Hoàn tác">↩ Hoàn tác</button>
        </div>

        <table class="history-table">
          <thead>
            <tr><th>Thời gian</th><th>Loại</th><th>Nguồn</th><th class="right">Số tiền</th></tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
        <button id="btnLoadMore" class="load-more-btn hidden" type="button">Xem thêm giao dịch cũ</button>
      </div>
    </div>

    <!-- Thống kê Tháng -->
    <div class="card">
      <div class="history-head">
        <h2>Thu/Chi trong tháng</h2>
        <button id="toggleMonthly" class="btn btn-ghost" style="padding:6px 10px;font-size:13px" type="button">Hiện</button>
      </div>
      <div id="monthlyWrapper" class="hidden">
        <input id="monthPicker" type="month" style="margin:8px 0;width:100%" />
        <div class="grid-2">
          <div class="stat" style="background:rgba(220,38,38,0.1); border:1px solid rgba(220,38,38,0.2)">
            <div class="label">Chi trong tháng</div>
            <div id="totalChi" class="value" style="color:var(--danger)">0 đ</div>
          </div>
          <div class="stat" style="background:rgba(22,163,74,0.1); border:1px solid rgba(22,163,74,0.2)">
            <div class="label">Thu trong tháng</div>
            <div id="totalThu" class="value" style="color:var(--success)">0 đ</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function(){
    const STORAGE_KEY="money-manager-v1";
    let state={
      balances:{bank:0,cash:0},
      history:[],
      hiddenHistory:[],
      showHistory:false,
      showMonthly:false,
      theme: localStorage.getItem("theme") || "light",
      displayLimit: 30,
      selectedMonth:(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`})()
    };
    
    const sourceEl=document.getElementById("source"), amountEl=document.getElementById("amount");
    const btn000=document.getElementById("btn000"), btnAdd=document.getElementById("btnAdd"), btnSubtract=document.getElementById("btnSubtract"), btnRefund=document.getElementById("btnRefund"), btnUndo=document.getElementById("btnUndo");
    const bankBalanceEl=document.getElementById("bankBalance"), cashBalanceEl=document.getElementById("cashBalance"), totalBalanceEl=document.getElementById("totalBalance");
    const toggleHistoryBtn=document.getElementById("toggleHistory"), historyWrapper=document.getElementById("historyWrapper"), historyBody=document.getElementById("historyBody"), btnLoadMore=document.getElementById("btnLoadMore");
    const toggleMonthlyBtn=document.getElementById("toggleMonthly"), monthlyWrapper=document.getElementById("monthlyWrapper"), monthPicker=document.getElementById("monthPicker");
    const totalChiEl=document.getElementById("totalChi"), totalThuEl=document.getElementById("totalThu");
    const btnClearHistory=document.getElementById("btnClearHistory"), themeToggleBtn=document.getElementById("themeToggle");

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", state.theme);
      themeToggleBtn.textContent = state.theme === "dark" ? "☀️ Chế độ sáng" : "🌙 Chế độ tối";
      localStorage.setItem("theme", state.theme);
    }
    themeToggleBtn.addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
    });

    function fmt(num){ return Number(num||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g," "); }

    amountEl.addEventListener("input", (e) => {
      let raw = e.target.value.replace(/\D/g, "");
      e.target.value = raw ? fmt(raw) : "";
    });

    window.addQuick = function(num) {
      let cur = Number(amountEl.value.replace(/\s+/g, "")) || 0;
      amountEl.value = fmt(cur + num);
    };

    function load(){
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw){
        try{
          const p=JSON.parse(raw);
          state.balances=p.balances||state.balances;
          state.history=p.history||[];
          state.hiddenHistory=p.hiddenHistory||[];
        }catch(e){}
      }
      applyTheme();
    }
    
    function save(){
      localStorage.setItem(STORAGE_KEY,JSON.stringify({balances:state.balances,history:state.history,hiddenHistory:state.hiddenHistory}));
    }

    function addHistory(val,src,type){
      const d=new Date(),days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      state.history.unshift({
        id:Date.now(), type, src, value:val,
        time:d.toLocaleTimeString("vi-VN",{hour12:false}),
        date:d.toLocaleDateString("vi-VN"),
        weekday:days[d.getDay()],
        yr: d.getFullYear(), mo: d.getMonth() + 1
      });
      save(); render();
    }
    
    function confirmAction(type,val,src){
      const srcText=src==="bank"?"Ngân hàng":"Tiền mặt";
      return confirm(`Xác nhận "${type}" ${fmt(val)} đ / ${srcText}?`);
    }
    
    function add(){const v=Number(amountEl.value.replace(/\s+/g,""));if(v>0&&confirmAction("Thu",v,sourceEl.value)){state.balances[sourceEl.value]+=v;addHistory(v,sourceEl.value,"Thu");amountEl.value="";}}
    function sub(){const v=Number(amountEl.value.replace(/\s+/g,""));if(v>0&&confirmAction("Chi",v,sourceEl.value)){state.balances[sourceEl.value]-=v;addHistory(v,sourceEl.value,"Chi");amountEl.value="";}}
    function ref(){const v=Number(amountEl.value.replace(/\s+/g,""));if(v>0&&confirmAction("Hoàn",v,sourceEl.value)){state.balances[sourceEl.value]+=v;addHistory(v,sourceEl.value,"Hoàn");amountEl.value="";}}
    
    function undo(){
      if(state.history.length===0){alert("Không có giao dịch để hoàn tác.");return;}
      const last=state.history.shift();
      if(!confirm(`Hoàn tác giao dịch "${last.type}" ${fmt(last.value)} đ / ${last.src==="bank"?"Ngân hàng":"Tiền mặt"}?`)){
          state.history.unshift(last); return;
      }
      if(last.type==="Thu"){state.balances[last.src]-=last.value;}
      else if(last.type==="Chi"){state.balances[last.src]+=last.value;}
      else if(last.type==="Hoàn"){state.balances[last.src]-=last.value;}
      save(); render();
    }

    function add000(e){
      e.preventDefault();
      const cur=Number(amountEl.value.replace(/\s+/g,""))||0;
      amountEl.value=cur===0?"1 000":fmt(cur*1000);
    }
    
    function renderHistory(){
      historyBody.innerHTML="";
      if(state.history.length===0){
        historyBody.innerHTML="<tr><td colspan='4' style='text-align:center;color:var(--muted);padding:12px'>Không có dữ liệu</td></tr>";
        btnLoadMore.classList.add("hidden");
        return;
      }
      
      const visibleData = state.history.slice(0, state.displayLimit);
      visibleData.forEach(h=>{
        const tr=document.createElement("tr");
        const valClass = h.type === "Thu" || h.type === "Hoàn" ? "val-plus" : "val-minus";
        const sign = h.type === "Thu" || h.type === "Hoàn" ? "+" : "-";
        
        tr.innerHTML=`
          <td>${h.time} (${h.date})</td>
          <td><span class="badge ${h.type==="Thu"?"t":h.type==="Chi"?"c":"h"}">${h.type[0]}</span></td>
          <td>${h.src==="bank"?"NH":"TM"}</td>
          <td class="right ${valClass}">${sign}${fmt(h.value)} đ</td>
        `;
        historyBody.appendChild(tr);
      });

      if(state.history.length > state.displayLimit) {
        btnLoadMore.classList.remove("hidden");
      } else {
        btnLoadMore.classList.add("hidden");
      }
    }

    btnLoadMore.addEventListener("click", () => {
      state.displayLimit += 30;
      renderHistory();
    });

    function renderBalances(){
      const b=state.balances.bank, c=state.balances.cash, t=b+c;
      bankBalanceEl.textContent=fmt(b)+" đ";
      cashBalanceEl.textContent=fmt(c)+" đ";
      totalBalanceEl.textContent=fmt(t)+" đ";
    }
    
    function renderMonthly(){
        if(!state.selectedMonth) return;
        const [y,m]=state.selectedMonth.split("-").map(Number);
        const allData = [...state.history, ...state.hiddenHistory];
        
        const rec=allData.filter(h=>{
          if(h.yr && h.mo) return h.yr === y && h.mo === m;
          const cleanDate = (h.date || "").replace(/[^\d/]/g, "");
          const parts=cleanDate.split("/");
          if(parts.length>=3) return Number(parts[2])===y && Number(parts[1])===m;
          return false;
        });
        
        let chi=rec.filter(h=>h.type==="Chi").reduce((s,h)=>s+h.value,0);
        const hoan=rec.filter(h=>h.type==="Hoàn").reduce((s,h)=>s+h.value,0);
        const thu=rec.filter(h=>h.type==="Thu").reduce((s,h)=>s+h.value,0);
        chi=Math.max(chi-hoan,0);
        totalChiEl.textContent=fmt(chi)+" đ"; totalThuEl.textContent=fmt(thu)+" đ";
    }

    function render(){
        renderBalances(); renderHistory(); renderMonthly();
        monthPicker.value=state.selectedMonth;
        historyWrapper.classList.toggle("hidden",!state.showHistory);
        toggleHistoryBtn.textContent=state.showHistory?"Ẩn":"Hiện";
        monthlyWrapper.classList.toggle("hidden",!state.showMonthly);
        toggleMonthlyBtn.textContent=state.showMonthly?"Ẩn":"Hiện";
    }

    load();
    btn000.addEventListener("click",add000);
    document.getElementById("mainForm").addEventListener("submit",e=>{e.preventDefault();add();});
    btnAdd.addEventListener("click",e=>{e.preventDefault();add();});
    btnSubtract.addEventListener("click",e=>{e.preventDefault();sub();});
    btnRefund.addEventListener("click",e=>{e.preventDefault();ref();});
    btnUndo.addEventListener("click",e=>{e.preventDefault();undo();});
    
    btnClearHistory.addEventListener("click", () => {
        if(state.history.length === 0){ alert("Lịch sử đang trống!"); return; }
        if(confirm("Sure?")){
            state.hiddenHistory = [...state.hiddenHistory, ...state.history];
            state.history = []; 
            save(); render();
        }
    });

    toggleHistoryBtn.addEventListener("click",()=>{state.showHistory=!state.showHistory;render();});
    toggleMonthlyBtn.addEventListener("click",()=>{state.showMonthly=!state.showMonthly;render();});
    monthPicker.addEventListener("change",e=>{state.selectedMonth=e.target.value;renderMonthly();});
    
    render();
  })();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
